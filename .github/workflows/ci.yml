name: CI

# Product blocking authority (ADR-0014 / ADR-0024 / PLAN-0044 / PLAN-0052):
#   Sole merge/release gate = `npm run check:must-ship` (all branches / PRs).
#   Gen1 `npm run check` remains available locally; CI observation job removed (PLAN-0052 Stage 2 / exit 4a).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  must-ship:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4
        with:
          node-version: 20

      - name: Must-ship mechanical gates
        run: npm run check:must-ship
